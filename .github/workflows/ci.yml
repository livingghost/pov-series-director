name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify generated worked example
        run: python scripts/build_demo.py --check

      - name: Verify generated adapters
        run: python scripts/build_flat.py --check

      - name: Validate repository and example boundaries
        run: python scripts/validate_skill.py

      - name: Build and validate release archive
        run: python scripts/build_release.py
